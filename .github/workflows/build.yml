name: Build APKs

# Produces two installable APKs on every run:
#   * 64-bit  (arm64-v8a + x86_64 emulator)
#   * 32-bit  (armeabi-v7a)
#
# The APKs are published as real .apk files attached to a GitHub Release.
# (Actions artifacts are always delivered as a .zip by GitHub itself, which is
# why the Release assets below are the recommended download.)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build 32-bit and 64-bit APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          # The runner usually ships cmdline-tools; bootstrap them if not.
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Bootstrapping Android command-line tools into $SDK"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi

          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using signing key from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            ALIAS="${KEY_ALIAS:-chimera}"
            STOREPASS="${KEYSTORE_PASSWORD:-changeit}"
            KEYPASS="${KEY_PASSWORD:-$STOREPASS}"
          else
            echo "No signing secrets found; generating a throwaway key."
            echo "Add RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD /"
            echo "RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD secrets for stable updates."
            ALIAS="chimera"
            STOREPASS="chimera-ci"
            KEYPASS="chimera-ci"
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=Chimera Terminal, O=ChimeraAnt, C=US" > /dev/null
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=${STOREPASS}"
            echo "keyAlias=${ALIAS}"
            echo "keyPassword=${KEYPASS}"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testArm64ReleaseUnitTest

      - name: Build 64-bit release APK
        run: ./gradlew --no-daemon :app:assembleArm64Release

      - name: Build 32-bit release APK
        run: ./gradlew --no-daemon :app:assembleArm32Release

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in
            v*) ;;
            *)  VERSION="v1.0.0-${GITHUB_SHA::7}" ;;
          esac
          # Artifact and asset names cannot contain path separators.
          VERSION="${VERSION//\//-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Plain copies: each output stays a .apk file, never archived.
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk \
             "dist/ChimeraTerminal-${VERSION}-arm64-v8a.apk"
          cp app/build/outputs/apk/arm32/release/app-arm32-release.apk \
             "dist/ChimeraTerminal-${VERSION}-armeabi-v7a.apk"

          ls -la dist/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChimeraTerminal-${{ env.VERSION }}-apks
          path: dist/*.apk
          if-no-files-found: error

      # Release assets are delivered as raw .apk files, not zips.
      - name: Publish APKs to a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Chimera Terminal ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ChimeraTerminal-${{ env.VERSION }}-arm64-v8a.apk
            dist/ChimeraTerminal-${{ env.VERSION }}-armeabi-v7a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
