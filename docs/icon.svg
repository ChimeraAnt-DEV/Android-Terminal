<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1A2B"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6F1FF"/>
      <stop offset="1" stop-color="#7FD4FF"/>
    </linearGradient>
    <linearGradient id="ice2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8E8FF"/>
      <stop offset="1" stop-color="#4A9FD0"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" rx="22" fill="url(#sky)"/>

  <!-- distant frost peaks -->
  <path d="M0 88 L18 74 L34 86 L52 70 L70 84 L88 72 L108 86 L108 108 L0 108 Z"
        fill="#147FD4FF"/>

  <!-- chevron -->
  <path d="M32 38 L48 54 L32 70 L39 77 L62 54 L39 31 Z" fill="url(#ice)"/>

  <!-- underscore -->
  <path d="M58 66 L84 66 L84 74 L58 74 Z" fill="#E6F1F8"/>

  <!-- icicles on the chevron -->
  <path d="M36 72 L42 72 L39 84 Z" fill="url(#ice2)"/>
  <path d="M45 74 L50 74 L47.5 83 Z" fill="#7FD4FF"/>

  <!-- icicles on the underscore -->
  <path d="M60 74 L65 74 L62.5 90 Z" fill="url(#ice)"/>
  <path d="M69 74 L74 74 L71.5 86 Z" fill="url(#ice2)"/>
  <path d="M78 74 L83 74 L80.5 82 Z" fill="#7FD4FF"/>

  <!-- frost specks -->
  <path d="M26 30 L29 30 L27.5 35 Z" fill="#7FD4FF"/>
  <path d="M86 40 L89 40 L87.5 45 Z" fill="#9FE0FF"/>
</svg>
